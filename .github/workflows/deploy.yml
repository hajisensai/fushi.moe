name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with VitePress
        run: npm run docs:build

      # 两个来源必须拿到逐字节相同的产物：VitePress 的资源名带内容哈希，
      # 两侧不一致时用户在切换瞬间会拿 A 的 HTML 去请求 B 没有的资源。
      # 所以这里只构建一次，后面两个部署 job 复用同一个 artifact。
      - name: Upload build artifact (shared by both deploy jobs)
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: .vitepress/dist
          retention-days: 7

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # GitHub Pages 侧。注意仓库不能设自定义域（CNAME 已删）：
  # 设了的话 hajisensai.github.io 会 301 跳回主域，备源就形同虚设。
  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-cloudflare-pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 密钥没配好之前不该让每次 push 都红。缺密钥就跳过并留一条 notice。
      - name: Check Cloudflare credentials
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过 Cloudflare Pages 部署。站点此时只有 GitHub Pages 一个来源，故障切换不成立。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the same artifact GitHub Pages got
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fushi-moe --branch=main

  # 边缘 Worker：站点回源切换 + 下载路由。它跟站点产物无关，单独发。
  deploy-edge-worker:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: edge/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # 切换逻辑错了比不切换更糟——熔断顺序、回退目标、404 不切源这些
      # 必须在发上去之前就是绿的。
      - name: Unit tests
        run: npm test

      - name: Check Cloudflare credentials
        id: guard
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 Cloudflare 密钥，跳过 Worker 部署。"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy Worker
        if: steps.guard.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: edge
          command: deploy
