name = "fushi-moe-edge"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# 只接管主域。下载走同域 /releases，避免新增用户可见的别名域名。
# hajisensai.github.io 不在本 zone 内，
# 所以回源到它不会被自己再拦一次，天然不会递归。
routes = [
  { pattern = "fushi.moe/*", zone_name = "fushi.moe" },
]

[vars]
# CF Pages 自带域，不对用户展示
ORIGIN_CF_HOST = "fushi-moe.pages.dev"
ORIGIN_CF_PATH = ""
# GitHub 自带域，同样不对用户展示；仓库必须不设自定义域，否则它会 301 跳回主域
ORIGIN_GH_HOST = "hajisensai.github.io"
ORIGIN_GH_PATH = "/fushi.moe"
CANONICAL_HOST = "fushi.moe"
DOWNLOAD_PREFIX = "/releases"
# 100 = 常态全部走 CF Pages，GitHub 只在失败时接手。
# 备源的可用性由 /__health 持续探测，不靠分流真实流量来验证——
# 那样会让一部分用户在两侧产物不一致时撞上资源 404。
CF_WEIGHT = "100"
ORIGIN_TIMEOUT_MS = "3000"
BREAKER_COOLDOWN_S = "60"
GH_REPO = "hajisensai/Fushi"
# 新手引导推荐包（约 9.5 GB）。切片放它的 release：public 仓库 release 资产不计流量，
# 单资产上限 2 GB，所以按 256 MiB 切。/pack 路由不碰 GitHub API，也不碰 R2 ——
# R2 免费额度只有 10 GB，塞进整包就没地方放 app 的发布镜像了。
PACK_REPO = "hajisensai/fushi-pack"
PACK_PREFIX = "/pack"

# release 资产镜像。未创建时下载全部回退 GitHub，功能不缺，只是少一层冗余。
[[r2_buckets]]
binding = "MIRROR"
bucket_name = "fushi-releases"
